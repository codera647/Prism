name: Local application contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install contract-test dependencies (no model download)
        run: >-
          python -m pip install fastapi==0.143.0 uvicorn==0.54.0 python-multipart==0.0.32
          Pillow==12.3.0 numpy==2.5.3 scikit-learn==1.9.1 filelock==4.1.0
          pytest==9.1.1 httpx==0.28.1
          'trailforge @ git+https://github.com/codera647/Trailforge.git@fbefaf40fb39a1429dcc328184372214f9fd849d'
      - name: Install Prism host without ML dependencies
        run: python -m pip install --no-deps -e .
      - name: Run privacy, recovery and product contracts
        run: python -m pytest -q
      - name: Check browser script syntax
        run: node --check src/prism/web/app.js
